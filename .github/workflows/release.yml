name: Release

# Release auslösen: Version in package.json, src-tauri/Cargo.toml und src-tauri/tauri.conf.json
# erhöhen, committen und ein Tag pushen:  git tag 0.2.0 && git push origin 0.2.0
on:
  push:
    tags: ["[0-9]*"]

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Overlay Manager ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
